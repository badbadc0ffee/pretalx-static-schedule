{% if recording.text or recording.links %}
    <section data-field="recording" aria-label="Recording">
        {% if recording.text %}<p>{{ recording.text }}</p>{% endif %}
        {% if recording.links %}
            <ul data-rel="recordings" aria-label="Recordings">
                {% for link in recording.links %}<li><a href="{{ link.url }}">{{ link.label }}</a></li>{% endfor %}
            </ul>
        {% endif %}
    </section>
{% endif %}
