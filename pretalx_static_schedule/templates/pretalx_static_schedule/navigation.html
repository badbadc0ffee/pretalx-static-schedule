<nav aria-label="Schedule">
    {% for group in page.navigation %}
        {% if group.items %}
            <ul data-group="{{ group.kind }}" aria-label="{{ group.label }}">
                {% for item in group.items %}
                    <li>
                        <a
                            {% for name, value in item.attributes.items %} {{ name }}="{{ value }}"{% endfor %}
                            href="{{ page.asset_prefix }}{{ item.filename }}"
                            {% if item.is_current %}aria-current="page"{% endif %}
                        >{% if item.date %}<time
                                    datetime="{{ item.date }}"
                                >{{ item.label }}</time>{% else %}{{ item.label }}{% endif %}</a>
                    </li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endfor %}
</nav>
